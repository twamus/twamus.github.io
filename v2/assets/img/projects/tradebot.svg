<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-label="Trade Bot">
  <rect width="500" height="300" fill="#161c26"/>
  <!-- candlesticks -->
  <g stroke="#4a9eff" stroke-width="8" stroke-linecap="round">
    <line x1="110" y1="185" x2="110" y2="130"/>
    <line x1="145" y1="170" x2="145" y2="115"/>
    <line x1="180" y1="150" x2="180" y2="100"/>
    <line x1="215" y1="160" x2="215" y2="105"/>
    <line x1="250" y1="175" x2="250" y2="120"/>
    <line x1="285" y1="190" x2="285" y2="135"/>
    <line x1="320" y1="165" x2="320" y2="110"/>
    <line x1="355" y1="200" x2="355" y2="145"/>
  </g>
  <g stroke="#4a9eff" stroke-width="4">
    <line x1="110" y1="185" x2="110" y2="200"/>
    <line x1="110" y1="130" x2="110" y2="115"/>
    <line x1="145" y1="170" x2="145" y2="185"/>
    <line x1="145" y1="115" x2="145" y2="100"/>
    <line x1="180" y1="150" x2="180" y2="165"/>
    <line x1="180" y1="100" x2="180" y2="85"/>
    <line x1="215" y1="160" x2="215" y2="175"/>
    <line x1="215" y1="105" x2="215" y2="90"/>
    <line x1="250" y1="175" x2="250" y2="190"/>
    <line x1="250" y1="120" x2="250" y2="105"/>
    <line x1="285" y1="190" x2="285" y2="205"/>
    <line x1="285" y1="135" x2="285" y2="120"/>
    <line x1="320" y1="165" x2="320" y2="180"/>
    <line x1="320" y1="110" x2="320" y2="95"/>
    <line x1="355" y1="200" x2="355" y2="215"/>
    <line x1="355" y1="145" x2="355" y2="130"/>
  </g>
  <!-- trend line -->
  <polyline points="110,140 145,120 180,105 215,115 250,128 285,142 320,120 355,155" fill="none" stroke="#27c93f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
