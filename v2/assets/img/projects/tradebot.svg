<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-label="Trade Bot">
  <rect width="500" height="300" fill="#161c26"/>
  <rect x="60" y="55" width="380" height="200" rx="10" fill="#0d1117" stroke="#232c3a" stroke-width="2"/>
  <rect x="60" y="55" width="380" height="34" rx="10" fill="#1c2430"/>
  <circle cx="88" cy="72" r="5" fill="#ff5f56"/>
  <circle cx="106" cy="72" r="5" fill="#ffbd2e"/>
  <circle cx="124" cy="72" r="5" fill="#27c93f"/>
  <text x="88" y="150" font-family="monospace" font-size="20" fill="#9aa7b4">$ tradebot run --paper</text>
  <!-- candlesticks -->
  <g stroke="#4a9eff" stroke-width="6" stroke-linecap="round">
    <line x1="110" y1="160" x2="110" y2="215"/>
    <line x1="145" y1="145" x2="145" y2="200"/>
    <line x1="180" y1="130" x2="180" y2="180"/>
    <line x1="215" y1="135" x2="215" y2="190"/>
    <line x1="250" y1="150" x2="250" y2="205"/>
    <line x1="285" y1="165" x2="285" y2="220"/>
    <line x1="320" y1="140" x2="320" y2="195"/>
    <line x1="355" y1="175" x2="355" y2="230"/>
  </g>
  <g stroke="#4a9eff" stroke-width="3">
    <line x1="110" y1="215" x2="110" y2="230"/>
    <line x1="110" y1="160" x2="110" y2="145"/>
    <line x1="145" y1="200" x2="145" y2="215"/>
    <line x1="145" y1="145" x2="145" y2="130"/>
    <line x1="180" y1="180" x2="180" y2="195"/>
    <line x1="180" y1="130" x2="180" y2="115"/>
    <line x1="215" y1="190" x2="215" y2="205"/>
    <line x1="215" y1="135" x2="215" y2="120"/>
    <line x1="250" y1="205" x2="250" y2="220"/>
    <line x1="250" y1="150" x2="250" y2="135"/>
    <line x1="285" y1="220" x2="285" y2="235"/>
    <line x1="285" y1="165" x2="285" y2="150"/>
    <line x1="320" y1="195" x2="320" y2="210"/>
    <line x1="320" y1="140" x2="320" y2="125"/>
    <line x1="355" y1="230" x2="355" y2="245"/>
    <line x1="355" y1="175" x2="355" y2="160"/>
  </g>
  <!-- trend line -->
  <polyline points="110,170 145,150 180,135 215,145 250,158 285,172 320,150 355,185" fill="none" stroke="#27c93f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
